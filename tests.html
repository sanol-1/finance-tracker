<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Validator tests</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 48rem; margin: 1rem auto; padding: 0 1rem; color: #16242e; }
    li { padding: .2rem 0; }
    .pass::before { content: "PASS "; color: #0b5d4b; font-weight: 700; }
    .fail::before { content: "FAIL "; color: #8a3b00; font-weight: 700; }
    #summary { font-weight: 700; }
  </style>
</head>
<body>
  <h1>Validator tests</h1>
  <p id="summary" role="status"></p>
  <ul id="results"></ul>

  <script type="module">
    import {
      validateDescription, validateAmount, validateDate, validateCategory,
      findDuplicateWord, collapseSpaces, validateRecord,
      validateImportData, validateSettingsForm, validateRecordShape, validateSettingsObject,
    } from './scripts/validators.js';
    import { computeStats, last7Days, capStatus, convertTotals } from './scripts/stats.js';

    const out = document.getElementById('results');
    let passed = 0, failed = 0;
    function check(name, actual, expected) {
      const ok = actual === expected;
      ok ? passed++ : failed++;
      const li = document.createElement('li');
      li.className = ok ? 'pass' : 'fail';
      li.textContent = ok ? name : `${name} (expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)})`;
      out.appendChild(li);
    }
    const valid = (msg) => msg === '';

    check('description: normal text is valid', valid(validateDescription('Lunch at cafeteria')), true);
    check('description: leading space rejected', valid(validateDescription(' Lunch')), false);
    check('description: trailing space rejected', valid(validateDescription('Lunch ')), false);
    check('description: empty rejected', valid(validateDescription('')), false);
    check('description: single character valid', valid(validateDescription('A')), true);

    check('advanced: finds repeated word', findDuplicateWord('Bought the the book'), 'the');
    check('advanced: repeat is case-insensitive', findDuplicateWord('Tea tea'), 'Tea');
    check('advanced: no repeat returns null', findDuplicateWord('Bus pass'), null);
    check('advanced: repeated word fails validation', valid(validateDescription('Coffee coffee')), false);
    check('collapse: double spaces become one', collapseSpaces('Bus   pass'), 'Bus pass');

    check('amount: 12.50 valid', valid(validateAmount('12.50')), true);
    check('amount: 0 valid', valid(validateAmount('0')), true);
    check('amount: 0.5 valid', valid(validateAmount('0.5')), true);
    check('amount: 007 rejected', valid(validateAmount('007')), false);
    check('amount: 12.345 rejected', valid(validateAmount('12.345')), false);
    check('amount: -5 rejected', valid(validateAmount('-5')), false);
    check('amount: letters rejected', valid(validateAmount('12a')), false);
    check('amount: huge number valid', valid(validateAmount('99999999.99')), true);

    check('date: 2025-09-29 valid', valid(validateDate('2025-09-29')), true);
    check('date: leap day valid', valid(validateDate('2024-02-29')), true);
    check('date: non-leap Feb 29 rejected', valid(validateDate('2025-02-29')), false);
    check('date: month 13 rejected', valid(validateDate('2025-13-01')), false);
    check('date: wrong format rejected', valid(validateDate('29/09/2025')), false);
    check('date: Apr 31 rejected', valid(validateDate('2025-04-31')), false);

    check('category: Food valid', valid(validateCategory('Food')), true);
    check('category: two words valid', valid(validateCategory('Study Material')), true);
    check('category: hyphen valid', valid(validateCategory('Part-time')), true);
    check('category: digits rejected', valid(validateCategory('Food2')), false);
    check('category: double space rejected', valid(validateCategory('Study  Material')), false);
    check('category: trailing hyphen rejected', valid(validateCategory('Food-')), false);

    const good = { description: 'Bus pass', amount: '45.00', category: 'Transport', date: '2025-09-20' };
    check('record: good record has no errors', Object.keys(validateRecord(good)).length, 0);
    check('record: bad record reports each bad field',
      Object.keys(validateRecord({ description: ' x', amount: 'a', category: '1', date: 'z' })).length, 4);

    const sample = [
      { amount: 10, category: 'Food', date: '2025-09-29' },
      { amount: 5.5, category: 'Food', date: '2025-09-29' },
      { amount: 20, category: 'Books', date: '2025-09-25' },
    ];
    const st = computeStats(sample);
    check('stats: count', st.count, 3);
    check('stats: sum rounds correctly', st.sum, 35.5);
    check('stats: top category by amount', st.top.category, 'Books');
    check('stats: empty list has no top', computeStats([]).top, null);
    const days = last7Days(sample, new Date(2025, 8, 29));
    check('trend: 7 days', days.length, 7);
    check('trend: last day total', days[6].total, 15.5);
    check('trend: day 4 before is 25th', days[4].date, '2025-09-27');
    check('trend: 25th is inside window with 20', days[2].total, 20);
    check('trend: record before window ignored',
      last7Days([{ amount: 99, category: 'X', date: '2025-09-22' }], new Date(2025, 8, 29)).every((d) => d.total === 0), true);
    check('cap: none when empty', capStatus(10, null).state, 'none');
    check('cap: under', capStatus(10, 50).amount, 40);
    check('cap: exact', capStatus(50, 50).state, 'exact');
    check('cap: over', capStatus(60.5, 50).amount, 10.5);
    check('cap: float safe', capStatus(0.1 + 0.2, 0.3).state, 'exact');

    const rec = { id: 'txn_0001', description: 'Lunch', amount: 12.5, category: 'Food', date: '2025-09-25',
                  createdAt: '2025-09-25T08:00:00.000Z', updatedAt: '2025-09-25T08:00:00.000Z' };
    check('import: bare array accepted', validateImportData([rec]).ok, true);
    check('import: {records} object accepted', validateImportData({ records: [rec] }).ok, true);
    check('import: not-a-list rejected', validateImportData({ foo: 1 }).ok, false);
    check('import: null rejected', validateImportData(null).ok, false);
    check('import: bad date rejected', validateImportData([{ ...rec, date: '2025-02-30' }]).ok, false);
    check('import: negative amount rejected', validateImportData([{ ...rec, amount: -1 }]).ok, false);
    check('import: 3 decimals rejected', validateRecordShape({ ...rec, amount: 1.234 }) !== '', true);
    check('import: string amount rejected', validateRecordShape({ ...rec, amount: '5' }) !== '', true);
    check('import: bad id rejected', validateRecordShape({ ...rec, id: 'abc' }) !== '', true);
    check('import: duplicate ids rejected', validateImportData([rec, { ...rec }]).ok, false);
    check('import: padded description rejected', validateRecordShape({ ...rec, description: ' x' }) !== '', true);
    check('import: missing timestamps rejected', validateRecordShape({ ...rec, createdAt: undefined }) !== '', true);
    check('import: extra fields stripped', 'evil' in validateImportData([{ ...rec, evil: 1 }]).records[0], false);
    check('import: one bad record rejects whole file', validateImportData([rec, { ...rec, id: 'txn_0002', amount: 'x' }]).ok, false);
 
    const goodSettings = { baseCurrency: 'USD', currencies: [{ code: 'EUR', rate: 0.92 }, { code: 'RWF', rate: 1450 }],
                           categories: ['Food', 'Books'], cap: null };
    check('settings: valid object accepted', validateSettingsObject(goodSettings).ok, true);
    check('settings: zero rate rejected', validateSettingsObject({ ...goodSettings, currencies: [{ code: 'EUR', rate: 0 }, { code: 'RWF', rate: 1 }] }).ok, false);
    check('settings: duplicate currency rejected', validateSettingsObject({ ...goodSettings, currencies: [{ code: 'USD', rate: 1 }, { code: 'RWF', rate: 1 }] }).ok, false);
    const form = { baseCurrency: 'USD', cur2: 'EUR', rate2: '0.92', cur3: 'RWF', rate3: '1450', categories: 'Food, Books' };
    check('settings form: valid has no errors', Object.keys(validateSettingsForm(form)).length, 0);
    check('settings form: lowercase code rejected', 'cur2' in validateSettingsForm({ ...form, cur2: 'eur' }), true);
    check('settings form: rate 0 rejected', 'rate2' in validateSettingsForm({ ...form, rate2: '0' }), true);
    check('settings form: digit in category rejected', 'categories' in validateSettingsForm({ ...form, categories: 'Food, B00ks' }), true);
    check('settings form: duplicate categories rejected', 'categories' in validateSettingsForm({ ...form, categories: 'Food, food' }), true);
    check('convert: 100 USD in EUR', convertTotals(100, [{ code: 'EUR', rate: 0.92 }])[0].total, 92);

    document.getElementById('summary').textContent =
      `${passed} passed, ${failed} failed (${passed + failed} total)`;
  </script>
</body>
</html>
